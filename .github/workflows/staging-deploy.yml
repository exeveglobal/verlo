# ==============================================================================
# verlo (WordPress plugin) — staging deploy
# Path in your repo: .github/workflows/staging-deploy.yml
#
# Part of the three-tier flow: main (dev) -> testnet (this file — builds and
# FTP-deploys straight to the demo WordPress site for manual QA) ->
# production (release.yml, once testnet has been approved by hand on the
# demo site).
#
# Demo site: https://flooring.exeve.lk
# FTP credentials live in repo secrets (FTP_HOST/FTP_USERNAME/FTP_PASSWORD) —
# never hardcode them here.
# ==============================================================================
name: Deploy verlo plugin to staging

on:
  push:
    branches:
      - testnet
  workflow_dispatch: {}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same gate as ci.yml/release.yml — a merge into testnet skips
      # ci.yml's own push trigger (that only fires on main), so this repeats
      # the check here rather than trusting it already happened upstream.
      - name: Check for BOM and stray leading bytes
        run: |
          bad=0
          while IFS= read -r f; do
            if [ "$(head -c 5 "$f")" != "<?php" ]; then
              echo "File does not start with <?php (BOM or stray bytes): $f"
              bad=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $bad

      - name: PHP syntax lint
        run: |
          bad=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || bad=1
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $bad

      # --exclude='build' matters here: without it, mkdir creates build/verlo
      # as an empty dir BEFORE rsync runs, and since that's inside the "./"
      # source tree being copied, rsync copies that now-existing (originally
      # empty, but present) build/ folder into itself too — a stray nested
      # build/verlo/build/verlo/ ends up inside the packaged output and gets
      # uploaded to the server. Confirmed live 2026-08-21 on the first real
      # deploy. release.yml has the same latent bug — worth fixing there too.
      - name: Package plugin build
        run: |
          mkdir -p build/verlo
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='build' \
            --exclude='CLAUDE.md' --exclude='.gitattributes' --exclude='.gitignore' \
            ./ build/verlo/

      # dangerous-clean-slate is deliberately left off (default) — this only
      # ever adds/updates files under the plugin's own folder, never deletes
      # anything on the server that isn't part of this build.
      #
      # server-dir is "/verlo", not "/" — confirmed live 2026-08-21: the
      # FTP_USERNAME sub-account's real root is wp-content/plugins/ itself
      # (it lists every other installed plugin — elementor, litespeed-cache,
      # etc. — as siblings), NOT the verlo subfolder specifically. "/" alone
      # would dump this plugin's loose files (admin/, includes/, verlo.php)
      # directly into wp-content/plugins/, which WordPress doesn't recognize
      # as a plugin and pollutes every other plugin's directory listing.
      - name: FTP deploy to demo site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: build/verlo/
          server-dir: /verlo/
